# Origem: o PostgreSQL do payment-service
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=payment-db
debezium.source.database.port=5432
debezium.source.database.user=postgres
debezium.source.database.password=postgres
debezium.source.database.dbname=payment
debezium.source.topic.prefix=payment
debezium.source.plugin.name=pgoutput
debezium.source.publication.autocreate.mode=filtered
debezium.source.table.include.list=public.outbox_events
debezium.source.snapshot.mode=no_data
debezium.source.tombstones.on.delete=false
debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=0

# Outbox Event Router: transforma a linha da outbox na mensagem
debezium.transforms=outbox
debezium.transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
debezium.transforms.outbox.table.field.event.id=id
debezium.transforms.outbox.table.field.event.key=aggregate_id
debezium.transforms.outbox.table.field.event.payload=payload
debezium.transforms.outbox.route.by.field=tipo
debezium.transforms.outbox.table.expand.json.payload=true

# Formato: só o JSON do payload, sem envelope de schema
debezium.format.value=json
debezium.format.value.schemas.enable=false

# Destino: o mesmo exchange e routing key do worker
debezium.sink.type=rabbitmq
debezium.sink.rabbitmq.connection.host=rabbitmq
debezium.sink.rabbitmq.connection.port=5672
debezium.sink.rabbitmq.connection.username=guest
debezium.sink.rabbitmq.connection.password=guest
debezium.sink.rabbitmq.exchange=pagamentos.exchange
debezium.sink.rabbitmq.routingKey=pagamento.aprovado
debezium.sink.rabbitmq.ackTimeout=3000